name: Release

on:
  push:
    tags:
      - "latest"
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Python syntax
        run: python3 -m py_compile app.py tray.py bridge.py sniffer.py boinc_stats.py mock_sender.py

      - name: Build archive
        run: |
          git archive --format=zip --prefix=odlk1-voxel/ \
            -o "odlk1-voxel.zip" HEAD

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${GITHUB_REF_NAME}" --yes || true
          gh release create "${GITHUB_REF_NAME}" "odlk1-voxel.zip" \
            --title "ODLK1 Voxel" \
            --notes-file .github/release_notes.md
